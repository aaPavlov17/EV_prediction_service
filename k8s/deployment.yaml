apiVersion: apps/v1
kind: Deployment
metadata:
  name: ev-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ev
  template:
    metadata:
      labels:
        app: ev
    spec:
      containers:
        - name: api
          image: ev-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet: {path: /health, port: 8000}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
