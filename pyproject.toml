[project]
name = "ev"
version = "0.1.1"
description = ""
requires-python=">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "scikit-learn==1.6.1",
    "joblib",
    "psycopg[binary]",
    "catboost>=1.2.10",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "locust",
    "ruff",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ev"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
